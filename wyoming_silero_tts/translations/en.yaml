configuration:
  voice:
    name: Voice
    description: >-
      Default Silero speaker. The 29 ru_ voices come from the multilingual
      v5_cis_base — each recorded by a native speaker of one of its
      languages, which is where the slight accents come from; xenia, baya,
      kseniya, aidar and eugene are the Russian-only v5_5_ru ones. The voice
      pipeline can override this per request.
  sample_rate:
    name: Sample rate
    description: >-
      Output sample rate in Hz. 48000 gives the best quality; 24000 is
      slightly cheaper to synthesize and stream.
  threads:
    name: CPU threads
    description: >-
      Torch thread count for synthesis. Two threads already synthesize far
      faster than real time; raise only if responses feel slow.
  transliterate:
    name: Transliterate Latin words
    description: >-
      The Silero model silently skips Latin script. When enabled,
      Latin words (device names, "Wi-Fi", "Spotify", ...) are transliterated
      to Cyrillic so they are spoken instead of dropped.
network:
  10200/tcp: Wyoming protocol server port
